main.datasource.url=jdbc:postgresql://localhost/rental
main.datasource.username=postgres
main.datasource.password=Cammis.99

main.liquibase.change-log=com/non/rental/liquibase/changelog.xml

jmix.ui.login-view-id=rental_LoginView
jmix.ui.main-view-id=rental_MainView
jmix.ui.menu-config=com/non/rental/menu.xml
jmix.ui.composite-menu=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

logging.level.org.atmosphere=warn

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

# RentCast API Configuration
rentcast.api.key=34fb2dfe78fb4d67a8a3fd6446e9fd73
rentcast.api.base-url=https://api.rentcast.io/v1
rentcast.api.timeout=30000
rentcast.api.max-retries=3
rentcast.cache.ttl-days=7
rentcast.cache.enabled=true

# RentCast API logging
logging.level.com.non.rental.service.rentcast=debug

# Stripe Payment Configuration
stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_your_test_key_here}
stripe.api.public-key=${STRIPE_PUBLIC_KEY:pk_test_your_test_key_here}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}
stripe.webhook.enabled=true

# Stripe Price IDs (configure these in Stripe Dashboard)
stripe.price.plus-monthly=${STRIPE_PRICE_PLUS_MONTHLY:price_plus_monthly}
stripe.price.plus-annual=${STRIPE_PRICE_PLUS_ANNUAL:price_plus_annual}
stripe.price.pro-monthly=${STRIPE_PRICE_PRO_MONTHLY:price_pro_monthly}
stripe.price.pro-annual=${STRIPE_PRICE_PRO_ANNUAL:price_pro_annual}

# Stripe Success/Cancel URLs
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/subscription/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/subscription/cancel}

# Stripe logging
logging.level.com.non.rental.service.stripe=debug
logging.level.com.stripe=info

# ============================================
# Email Configuration (User Registration)
# ============================================
# For development: Use Gmail with App Password
# For production: Use SendGrid, AWS SES, or Mailgun
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Jmix Email Configuration
jmix.email.from-address=${MAIL_FROM:noreply@yldz.io}
jmix.email.from-name=YLDZ
jmix.email.use-default-queue=true
jmix.email.scheduling.enabled=true

# User Registration Configuration
rental.registration.enabled=true
rental.registration.email-verification-required=true
rental.registration.token-expiry-hours=168
rental.registration.base-url=${APP_BASE_URL:http://localhost:8080}

# ============================================
# OAuth2 Social Login Configuration
# ============================================
# See EXTERNAL_SERVICES_SETUP.md for setup instructions

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id
