# ============================================
# Development Environment Configuration
# ============================================
# This profile is used for AWS EC2 deployment via Jmix Studio Quick Cloud Deployment
# To activate: Set SPRING_PROFILES_ACTIVE=dev environment variable

# Database Configuration (PostgreSQL on EC2)
# These will be overridden by environment variables in Docker deployment
main.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rental}
main.datasource.username=${DATABASE_USERNAME:postgres}
main.datasource.password=${DATABASE_PASSWORD:postgres}

# Hikari Connection Pool Settings for Dev
main.datasource.hikari.maximum-pool-size=10
main.datasource.hikari.minimum-idle=5
main.datasource.hikari.connection-timeout=30000
main.datasource.hikari.idle-timeout=600000
main.datasource.hikari.max-lifetime=1800000

# Liquibase
main.liquibase.change-log=com/non/rental/liquibase/changelog.xml

# Jmix UI Configuration
jmix.ui.login-view-id=rental_LoginView
jmix.ui.main-view-id=rental_MainView
jmix.ui.menu-config=com/non/rental/menu.xml
jmix.ui.composite-menu=true

# Default Login Credentials (Dev Only - Change in Production!)
ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

# Localization
jmix.core.available-locales=en

# Vaadin Configuration for Dev
vaadin.launch-browser=false
vaadin.productionMode=false
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.non.rental

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging Configuration for Dev
logging.level.root=INFO
logging.level.com.non.rental=DEBUG
logging.level.org.atmosphere=WARN
logging.level.eclipselink.logging.sql=INFO
logging.level.io.jmix.core.datastore=INFO
logging.level.io.jmix.core.AccessLogger=DEBUG
logging.level.io.jmix=INFO
logging.level.org.springframework.security=INFO

# RentCast API Configuration
rentcast.api.key=${RENTCAST_API_KEY:34fb2dfe78fb4d67a8a3fd6446e9fd73}
rentcast.api.base-url=https://api.rentcast.io/v1
rentcast.api.timeout=30000
rentcast.api.max-retries=3
rentcast.cache.ttl-days=7
rentcast.cache.enabled=true

# RentCast API logging
logging.level.com.non.rental.service.rentcast=DEBUG

# Spring Boot Actuator for Health Checks (Important for AWS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.db.enabled=true

# File Storage Configuration (Local for Dev)
jmix.localfs.storage-dir=${STORAGE_DIR:/opt/rental/storage}

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Development-specific settings
spring.devtools.restart.enabled=false
spring.jpa.show-sql=false