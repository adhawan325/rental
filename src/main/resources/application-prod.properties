# ============================================
# Production Environment Configuration
# ============================================
# This profile is used for production deployment
# To activate: Set SPRING_PROFILES_ACTIVE=prod environment variable

# Database Configuration (PostgreSQL Production)
# These will be overridden by environment variables in production deployment
main.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rental}
main.datasource.username=${DATABASE_USERNAME:postgres}
main.datasource.password=${DATABASE_PASSWORD}

# Hikari Connection Pool Settings for Production
main.datasource.hikari.maximum-pool-size=20
main.datasource.hikari.minimum-idle=10
main.datasource.hikari.connection-timeout=30000
main.datasource.hikari.idle-timeout=600000
main.datasource.hikari.max-lifetime=1800000

# Liquibase
main.liquibase.change-log=com/non/rental/liquibase/changelog.xml

# Jmix UI Configuration
jmix.ui.login-view-id=rental_LoginView
jmix.ui.main-view-id=rental_MainView
jmix.ui.menu-config=com/non/rental/menu.xml
jmix.ui.composite-menu=true

# Localization
jmix.core.available-locales=en

# Vaadin Configuration for Production
vaadin.launch-browser=false
vaadin.productionMode=true
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.non.rental

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging Configuration for Production
logging.level.root=INFO
logging.level.com.non.rental=INFO
logging.level.org.atmosphere=WARN
logging.level.eclipselink.logging.sql=WARN
logging.level.io.jmix.core.datastore=INFO
logging.level.io.jmix.core.AccessLogger=INFO
logging.level.io.jmix=INFO
logging.level.org.springframework.security=INFO

# RentCast API Configuration
rentcast.api.key=${RENTCAST_API_KEY}
rentcast.api.base-url=https://api.rentcast.io/v1
rentcast.api.timeout=30000
rentcast.api.max-retries=3
rentcast.cache.ttl-days=30
rentcast.cache.enabled=true

# RentCast API logging
logging.level.com.non.rental.service.rentcast=INFO

# Spring Boot Actuator for Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.db.enabled=true

# File Storage Configuration (Production)
jmix.localfs.storage-dir=${STORAGE_DIR:/opt/rental/storage}

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Production-specific settings
spring.devtools.restart.enabled=false
spring.jpa.show-sql=false

# Application Base URL for Production Environment
rental.registration.base-url=${APP_BASE_URL:https://app.yldz.io}

# Stripe URLs for Production Environment
stripe.success-url=${STRIPE_SUCCESS_URL:https://app.yldz.io/subscription/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:https://app.yldz.io/subscription/cancel}

# Stripe logging (less verbose in production)
logging.level.com.non.rental.service.stripe=INFO
logging.level.com.stripe=WARN

# Security Headers (Production)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false